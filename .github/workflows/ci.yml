name: CI

on:
  push:
  pull_request:
    types: [opened, synchronize, reopened]

# A push to a branch that also has an open pull request would otherwise run this
# workflow twice. The job below skips the pull_request event unless it comes from
# a fork, where the push event never fires for us.
#
# Superseded runs are cancelled: on a branch, only the newest commit matters.
# main is exempt, because a green tick there has to correspond to a real commit.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read

jobs:
  verify:
    name: Verify
    runs-on: ubuntu-latest
    timeout-minutes: 15
    if: >-
      github.event_name == 'push' ||
      github.event.pull_request.head.repo.full_name != github.repository

    steps:
      - uses: actions/checkout@v7

      # corepack reads packageManager from package.json, so CI resolves the same
      # pnpm as every developer. Pinning the version here as well would be a
      # second source of truth waiting to disagree with the first.
      - name: Enable corepack
        run: corepack enable

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm

      # --frozen-lockfile fails rather than silently resolving a different tree
      # when the lockfile and package.json disagree. In CI that disagreement is
      # a bug to surface, not a problem to solve.
      - name: Install
        run: pnpm install --frozen-lockfile

      # Ordered cheapest first, and failing fast: a formatting slip is reported
      # in seconds instead of after the test suite. Every step runs locally with
      # the same command, so nothing here can only be reproduced in CI.
      - name: Format
        run: pnpm format:check

      # Split from the ESLint step below because the two answer different
      # questions. A boundary violation means the architecture moved; a lint
      # error means the code did. Reading which one broke off the step name is
      # worth one extra line of YAML.
      - name: Architectural boundaries
        run: pnpm lint:boundaries

      - name: Lint
        run: pnpm lint:code

      # Catches the one thing a merge can silently produce: two migrations
      # generated from the same parent snapshot, on two branches, which apply in
      # an order nobody chose. Verified by staging exactly that collision - it
      # exits 1 and names both snapshots.
      #
      # It reads the migration folder and touches no database, so it belongs
      # here rather than in the database step. Note what it does not do: it
      # compares snapshots to each other, not the schema to the migrations, so
      # a schema change nobody generated a migration for still passes.
      - name: Migration consistency
        run: pnpm db:check

      - name: Typecheck
        run: pnpm typecheck

      - name: Unit tests and coverage
        run: pnpm test:coverage

      # Vitest writes its own block into the job summary, under a heading that
      # is the same string for every run - so two runs produced two identical
      # "Vitest Test Report" headings and no way to tell which was which. The
      # reporter has no option for it, and the summary is an ordinary markdown
      # file, so it is renamed in place. Exactly one block exists at this point;
      # the database step's is renamed after it, the same way.
      #
      # always(), because a name matters most on the run that failed.
      - name: Name the unit report
        if: always()
        run: |
          if [ -f "$GITHUB_STEP_SUMMARY" ]; then
            sed -i '0,/^## Vitest Test Report$/s//## Unit tests/' "$GITHUB_STEP_SUMMARY"
          fi
          node .github/summary.mjs coverage >> "$GITHUB_STEP_SUMMARY"

      # Testcontainers boots a real PostgreSQL 17. Split from the unit tests so a
      # logic failure is reported in seconds rather than after an image pull, and
      # so a Docker problem is never mistaken for a broken invariant.
      # ubuntu-latest ships a working Docker daemon, so no service block is needed.
      - name: Database tests
        run: pnpm test:db

      - name: Name the database report
        if: always()
        run: |
          if [ -f "$GITHUB_STEP_SUMMARY" ]; then
            sed -i '0,/^## Vitest Test Report$/s//## Database tests/' "$GITHUB_STEP_SUMMARY"
          fi

      # The application is rendered, in a browser, against a real database.
      #
      # It is here because a server-to-client boundary error reached a person:
      # a function passed as a prop, which compiles, typechecks, lints and
      # builds, and throws on the first render. Every other step in this file
      # passed it. Nothing short of rendering the page could have caught it.
      - name: Start the database
        run: pnpm db:up

      - name: Install Playwright browsers
        run: pnpm --filter @altitude/web exec playwright install chromium --with-deps

      # Generated per run rather than read from a repository secret. The value
      # only has to be a secret from the outside world, and this run has no
      # outside world - so there is nothing to store, rotate, or leak, and no
      # default sitting in the file waiting to be used in production.
      - name: Session secret for this run
        run: echo "AUTH_SECRET=$(openssl rand -base64 32)" >> "$GITHUB_ENV"

      - name: End-to-end
        run: pnpm test:e2e
        env:
          DATABASE_URL: postgres://altitude_app:altitude_app@localhost:55432/altitude
          MIGRATE_DATABASE_URL: postgres://altitude_migrate:altitude_migrate@localhost:55432/altitude
          E2E_ADMIN_DATABASE_URL: postgres://altitude:altitude@localhost:55432/altitude

      # Playwright says "29 passed" in an annotation, which is under the fold and
      # below the summary a reviewer actually reads. The same numbers, in the
      # same place as everything else.
      - name: Summarise the end-to-end run
        if: always()
        run: node .github/summary.mjs e2e >> "$GITHUB_STEP_SUMMARY"

      - name: Upload the Playwright report
        if: failure() && hashFiles('apps/web/playwright-report/**') != ''
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: apps/web/playwright-report/
          retention-days: 14

      - name: Upload coverage
        if: always() && hashFiles('coverage/**') != ''
        uses: actions/upload-artifact@v7
        with:
          name: coverage
          path: coverage/
          retention-days: 14
# Deliberately not here yet, each waiting on the code it would test:
#
#   build       next build + worker build          - needs a worker to build
#   sbom        CycloneDX                          - worth generating per release, not per commit
#   docker      buildx amd64/arm64 + cosign        - needs a Dockerfile (phase 6)
#
# Dependency auditing is covered by Dependabot alerts, already enabled on the
# repository. Running `pnpm audit` here as well would block an unrelated commit
# the morning an advisory is published, which trains people to ignore red ticks.

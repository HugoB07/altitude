# Development database only. The full stack (app, worker, caddy) is described in
# the development plan §14.1 and lands in phase 6.
#
#   pnpm db:up      start
#   pnpm db:down    stop
#   pnpm db:reset   destroy the volume and start clean
#
# These credentials are deliberately weak and hardcoded: this file is for local
# development and must never be used to run an exposed instance.

services:
  db:
    image: postgres:17-alpine
    container_name: altitude-dev-db
    environment:
      POSTGRES_DB: altitude
      POSTGRES_USER: altitude
      POSTGRES_PASSWORD: altitude
      # Deterministic collation, so ORDER BY behaves identically on every machine.
      POSTGRES_INITDB_ARGS: '--locale=C --encoding=UTF8'
    ports:
      # Loopback only: without the 127.0.0.1 prefix Docker publishes on every
      # interface, exposing a database whose password is "altitude" to anyone
      # on the same network - a hotel or coworking wifi included.
      #
      # Host port 55432, not 5432, so a PostgreSQL installed natively on the
      # machine keeps 5432 and there is never any doubt about which database a
      # client is talking to. Override with ALTITUDE_DB_PORT if it clashes.
      - '127.0.0.1:${ALTITUDE_DB_PORT:-55432}:5432'
    # Planner costs for storage that is not a spinning disk.
    #
    # random_page_cost defaults to 4, which says a random read costs four times
    # a sequential one. That was true of the hardware it was chosen for and is
    # not true of an SSD. The gap is not academic: counting a million
    # transactions, the planner rejected an index-only scan and read the whole
    # table instead - 548 ms where the index took 95.
    #
    # 1.1 rather than 1.0 so sequential access keeps a slight edge, which it
    # still deserves. Set here so that what a developer measures resembles what
    # a deployment does; a real deployment should set it too.
    command:
      - postgres
      - -c
      - random_page_cost=1.1
      - -c
      - effective_cache_size=1GB
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./initdb:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U altitude -d altitude']
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

volumes:
  pgdata:
